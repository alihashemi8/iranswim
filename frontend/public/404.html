<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه مورد نظر یافت نشد (خطای ۴۰۴) | مدرسه شنای ایران</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .header {
      width: 100%;
      max-width: 640px;
      margin-bottom: 2rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #38bdf8;
      font-weight: 800;
      font-size: 1.25rem;
    }
    .main-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #06b6d4, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      font-family: monospace;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .error-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0369a1;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="brand">
      <span>🏊‍♂️ مدرسه شنای ایران (IranSwim)</span>
    </a>
  </header>

  <main class="main-card">
    <div class="error-code">۴۰۴</div>
    <h1 class="error-title">صفحه مورد نظر در اعماق استخر پیدا نشد!</h1>
    <p class="error-desc">
      صفحه‌ای که به دنبال آن هستید ممکن است حذف شده باشد، آدرس آن تغییر کرده باشد یا به صورت موقت در دسترس نباشد.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        بازگشت به صفحه اصلی
      </a>
      <a href="/swimming-classes/" class="btn btn-secondary">
        مشاهده دوره‌ها و کلاس‌های شنا
      </a>
    </div>
  </main>

  <footer class="footer">
    <p>© ۱۴۰۵ مدرسه شنای ایران. تمامی حقوق محفوظ است.</p>
  </footer>
</body>
</html>
