server {
    listen 8080;
    server_name localhost;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;

    # Dynamic Authoritative SEO Sitemap (proxies to Django with static fallback)
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_sitemap;
    }

    location @static_sitemap {
        try_files /sitemap.xml =404;
    }

    # Dynamic Authoritative robots.txt (proxies to Django with static fallback)
    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_robots;
    }

    location @static_robots {
        try_files /robots.txt =404;
    }

    # Cache static frontend assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Internal SPA fallback location for X-Accel-Redirect from backend
    location /internal_spa/ {
        internal;
        alias /usr/share/nginx/html/;
    }

    # Blog Listing Index (/blog and /blog/) -> serve index.html directly
    location ~* ^/blog/?$ {
        try_files /index.html =404;
    }

    # Dynamic Blog Article Route: validate slug via Django backend before serving index.html
    location ~* ^/blog/([^/]+)/?$ {
        proxy_pass http://backend:8000/api/content/validate-article/$1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 404 =404 /404.html;
    }

    # Known SPA Application Routes -> serve index.html (HTTP 200)
    location ~* ^/(swimming-classes|courses|coaches|pricing|schedule|contact|login|register|supervisor|admin|coach|swimmer)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }

    # Exact Root -> serve index.html
    location = / {
        try_files /index.html =404;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django Admin Panel
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django Static Files (e.g. Admin styles via WhiteNoise)
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Block direct public access to sensitive swimmer documents
    location ^~ /media/swimmers/documents/ {
        return 404;
    }

    # Internal protected media location for X-Accel-Redirect from backend
    location /protected_media/ {
        internal;
        alias /usr/share/nginx/media/;
    }

    # Public media files (user uploads: avatars, news, pools)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Custom 404 handler returning real HTTP 404 status
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fallback for all other unknown paths: returns real HTTP 404 via error_page 404
    location / {
        try_files $uri $uri/ =404;
    }
}
