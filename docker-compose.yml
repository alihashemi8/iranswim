version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: iranswim_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iranswim}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/alihashemi8/iranswim-backend:latest
    build: ./backend
    container_name: iranswim_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --reload"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in production environment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DJANGO_USE_X_ACCEL_REDIRECT: ${DJANGO_USE_X_ACCEL_REDIRECT:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-iranswim}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ./backend:/app

  frontend:
    image: ghcr.io/alihashemi8/iranswim-frontend:latest
    build: ./frontend
    container_name: iranswim_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
